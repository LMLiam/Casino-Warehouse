name: Project Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, Coverage, and Server Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install launcher runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends expect

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Lint and typecheck
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build server
        run: npm run build:server

  playwright:
    name: Visual and E2E (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: laptop-visual
            label: Laptop Visual
            workers: 1
            args: --project=laptop tests/e2e/casino-visual.spec.ts
          - name: tablet-visual
            label: Tablet Visual
            workers: 1
            args: --project=tablet tests/e2e/casino-visual.spec.ts
          - name: laptop-multiplayer
            label: Laptop Multiplayer
            workers: 2
            args: --project=laptop tests/e2e/multiplayer-flow.spec.ts tests/e2e/public-tunnel-smoke.spec.ts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e and visual tests
        run: npm run visual -- --workers=${{ matrix.workers }} ${{ matrix.args }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test:
    name: Required Quality Gate
    runs-on: ubuntu-latest
    needs:
      - quality
      - playwright
    if: always()

    steps:
      - name: Verify required CI jobs
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.playwright.result }}" != "success" ]; then
            echo "quality=${{ needs.quality.result }}"
            echo "playwright=${{ needs.playwright.result }}"
            exit 1
          fi
