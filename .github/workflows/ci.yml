name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality, Coverage, and Server Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Lint and typecheck
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build server
        run: npm run build:server

  playwright:
    name: Playwright Visual and E2E (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: laptop-visual
            label: Laptop Visual
            args: --project=laptop tests/e2e/casino-visual.spec.ts
          - name: tablet-visual
            label: Tablet Visual
            args: --project=tablet tests/e2e/casino-visual.spec.ts
          - name: laptop-multiplayer
            label: Laptop Multiplayer
            args: --project=laptop tests/e2e/multiplayer-flow.spec.ts tests/e2e/ngrok-smoke.spec.ts

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e and visual tests
        run: npm run visual -- ${{ matrix.args }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test:
    # Keep this display name stable until branch protection is coordinated.
    name: test
    runs-on: ubuntu-latest
    needs:
      - quality
      - playwright
    if: always()

    steps:
      - name: Verify required CI jobs
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.playwright.result }}" != "success" ]; then
            echo "quality=${{ needs.quality.result }}"
            echo "playwright=${{ needs.playwright.result }}"
            exit 1
          fi
