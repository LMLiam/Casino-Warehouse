name: Project Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Server Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install launcher runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends expect

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Lint and typecheck
        run: npm run lint:static

      - name: Check supply-chain controls
        run: npm run supply-chain:check

      - name: Build server
        run: npm run build:server

  knip:
    name: Architecture and Knip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check architecture and unused code
        run: npm run architecture:check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

  e2e-plan:
    name: Plan e2e matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Build the e2e lane matrix
        id: plan
        run: echo "matrix=$(node scripts/ci-e2e-matrix.mjs)" >> "$GITHUB_OUTPUT"

  playwright:
    name: Visual and E2E (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: e2e-plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.e2e-plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Detect UI changes
        id: ui-path
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- 'src/ui/**'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright e2e and visual tests
        run: |
          if [ "${{ steps.ui-path.outputs.changed }}" = "true" ]; then
            npm run visual:serial -- ${{ matrix.playwrightArgs }}
          else
            npm run visual -- ${{ matrix.playwrightArgs }}
          fi

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test:
    name: Required Quality Gate
    runs-on: ubuntu-latest
    needs:
      - quality
      - knip
      - coverage
      - playwright
    if: always()

    steps:
      - name: Verify required CI jobs
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.knip.result }}" != "success" ] || [ "${{ needs.coverage.result }}" != "success" ] || [ "${{ needs.playwright.result }}" != "success" ]; then
            echo "quality=${{ needs.quality.result }}"
            echo "knip=${{ needs.knip.result }}"
            echo "coverage=${{ needs.coverage.result }}"
            echo "playwright=${{ needs.playwright.result }}"
            exit 1
          fi
