name: Issue Standards

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - milestoned
      - demilestoned

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-standards-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Issue Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      - name: Validate issue metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_STANDARDS_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/validate-issue-standards.mjs
