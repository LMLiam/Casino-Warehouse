name: Issue Standards

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - milestoned
      - demilestoned

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-standards-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Issue Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Validate issue metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_STANDARDS_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/validate-issue-standards.mjs
