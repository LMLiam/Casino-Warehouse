name: PR Standards

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: PR Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Validate PR metadata
        env:
          PR_STANDARDS_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/validate-pr-standards.mjs
